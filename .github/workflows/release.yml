name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb
        run: ./build-deb.sh
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: "*.deb"
